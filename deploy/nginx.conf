limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=speech:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=tts:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=reset:10m rate=3r/m;
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "microphone=(self)" always;
    # Only the public CA certificate is mounted here by the optional HTTPS stack.
    location = /lan-root-ca.crt {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="HablaEspanol-LAN-CA.crt"';
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location = /api/speech {
        limit_req zone=speech burst=5 nodelay;
        limit_req_status 429;
        proxy_read_timeout 130s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location = /api/tts {
        limit_req zone=tts burst=10 nodelay;
        limit_req_status 429;
        proxy_read_timeout 610s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location = /api/admin/reset-practice {
        limit_req zone=reset burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
