services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: spanish
      MYSQL_USER: spanish
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u spanish spanish -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  init:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://spanish:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/spanish?charset=utf8mb4
    command: [sh, -c, 'alembic upgrade head && python -m app.seed']
    depends_on:
      mysql:
        condition: service_healthy
    profiles: [setup]
  api:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://spanish:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/spanish?charset=utf8mb4
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SPEECH_URL: ${SPEECH_URL:-http://host.docker.internal:8001}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
    volumes:
      - cover_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health")']
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
    restart: unless-stopped
  web:
    build: .
    ports:
      - '127.0.0.1:3000:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql_data:
  cover_uploads:
